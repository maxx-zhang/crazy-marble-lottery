<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7413">
  <meta name="description" content="疯狂弹珠扫码抽奖活动">
  <title>疯狂弹珠 · 扫码抽奖</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23ffcf20' stroke='%23a81e22' stroke-width='5'/%3E%3Ccircle cx='25' cy='24' r='7' fill='%23fff' opacity='.85'/%3E%3Cpath d='M17 42c12-17 23-17 31-1' fill='none' stroke='%23ef382a' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20260928-3">
</head>
<body>
  <main class="page-shell">
    <section class="screen-stage" id="screenStage" aria-label="疯狂弹珠抽奖页面">
      <img id="screenImage" src="assets/home-reference.png" alt="疯狂弹珠抽奖首页">
      <button class="hotspot draw-hotspot" id="drawButton" type="button" aria-label="立即抽奖"></button>
      <button class="hotspot probability-hotspot" id="probabilityButton" type="button" aria-label="查看中奖概率"></button>
      <button class="result-probability-button" id="resultButton" type="button" aria-label="查看中奖概率">查看中奖概率　›</button>
      <button class="hotspot close-hotspot" id="closeButton" type="button" aria-label="关闭中奖概率"></button>
      <div class="live-prize" id="livePrize" aria-live="polite"></div>
      <div class="screen-loading" id="screenLoading">加载中…</div>
    </section>
    <section class="probability-modal" id="probabilityModal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="中奖概率公示">
      <div class="probability-card">
        <button class="probability-close" id="probabilityClose" type="button" aria-label="关闭中奖概率">×</button>
        <div class="probability-title"><span>★</span><strong>中奖概率公示</strong><span>★</span></div>
        <div class="probability-rows">
          <div><span>50颗弹珠</span><b>30%</b></div><div><span>100颗弹珠</span><b>35%</b></div>
          <div><span>150颗弹珠</span><b>10%</b></div><div><span>200颗弹珠</span><b>3%</b></div>
          <div><span>1积分卡</span><b>15%</b></div><div><span>5积分卡</span><b>4%</b></div>
          <div><span>10积分卡</span><b>2%</b></div><div><span>15积分卡</span><b>1%</b></div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
